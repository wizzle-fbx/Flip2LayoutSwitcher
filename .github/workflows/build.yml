name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the build if gradle-wrapper.jar is not an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Release signing needs the maintainer's key, so CI builds and checks the debug variant only.
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
